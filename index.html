<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autosale Motors - Cotizador</title>
  
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; width: 100%; max-width: 380px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    
    .logo-container { margin-bottom: 12px; }
    .logo-container img { max-width: 200px; height: auto; border-radius: 8px; }

    .field { margin-bottom: 14px; text-align: left; }
    label { display: block; font-size: 11px; font-weight: 700; color: #374151; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 16px; font-weight: 600; background: #f9fafb; outline: none; }
    input:focus { border-color: #dc2626; background: #fff; }

    .chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .chip { padding: 6px 10px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; font-weight: 600; color: #4b5563; cursor: pointer; transition: all 0.2s ease; }
    .chip.active { background: #dc2626; color: #fff; border-color: #dc2626; }

    .res-box { background: #10b981; color: #fff; border-radius: 12px; padding: 18px; text-align: center; margin-top: 16px; }
    .res-title { font-size: 11px; text-transform: uppercase; font-weight: 700; opacity: 0.9; }
    .res-main { font-size: 34px; font-weight: 800; margin-top: 2px; }

    .btn { width: 100%; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; margin-top: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { opacity: 0.9; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-container">
    <img src="logo.jpg" alt="Autosale Motors">
  </div>

  <div class="field">
    <label for="monto">Monto a financiar (Bs)</label>
    <input type="number" id="monto" value="150000" step="1000">
  </div>

  <div class="field">
    <label for="tasa">Tasa Anual (%)</label>
    <input type="number" id="tasa" value="16" step="0.1">
    <div class="chips" id="chips-tasa">
      <span class="chip" data-val="11.5" onclick="selectChip('tasa', 11.5, this)">11.5%</span>
      <span class="chip" data-val="12" onclick="selectChip('tasa', 12, this)">12%</span>
      <span class="chip active" data-val="16" onclick="selectChip('tasa', 16, this)">16%</span>
      <span class="chip" data-val="20" onclick="selectChip('tasa', 20, this)">20%</span>
      <span class="chip" data-val="22" onclick="selectChip('tasa', 22, this)">22%</span>
    </div>
  </div>

  <div class="field">
    <label for="anios">Plazo (Años)</label>
    <input type="number" id="anios" value="5" step="1">
    <div class="chips" id="chips-anios">
      <span class="chip active" data-val="5" onclick="selectChip('anios', 5, this)">5 Años</span>
      <span class="chip" data-val="7" onclick="selectChip('anios', 7, this)">7 Años</span>
    </div>
  </div>

  <div class="res-box">
    <div class="res-title">Cuota Mensual</div>
    <div class="res-main" id="resBs">Bs 0</div>
  </div>

  <button class="btn" onclick="copiar()">📲 Copiar para WhatsApp</button>
</div>

<script>
  // Porcentaje adicional de seguro de desgravamen
  const SEGURO_DESGRAVAMEN = 1.55;

  function selectChip(inputId, value, element) {
    document.getElementById(inputId).value = value;
    updateChips(inputId, value);
    calc();
  }

  function updateChips(inputId, value) {
    const container = document.getElementById(`chips-${inputId}`);
    if (!container) return;
    
    container.querySelectorAll('.chip').forEach(chip => {
      if (parseFloat(chip.getAttribute('data-val')) === parseFloat(value)) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });
  }

  function calc() {
    const P = parseFloat(document.getElementById('monto').value) || 0;
    const tasaInteres = parseFloat(document.getElementById('tasa').value) || 0;
    const yrs = parseFloat(document.getElementById('anios').value) || 0;

    if (P <= 0 || tasaInteres <= 0 || yrs <= 0) {
      document.getElementById('resBs').innerText = "Bs 0";
      return;
    }

    // Cálculo sumando el porcentaje de desgravamen
    const tasaTotal = tasaInteres + SEGURO_DESGRAVAMEN;
    const n = yrs * 12;
    const i = (tasaTotal / 100) / 12;

    const cuotaBs = P * (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1);
    const bsRedondeado = Math.round(cuotaBs);

    document.getElementById('resBs').innerText = "Bs " + bsRedondeado.toLocaleString('es-BO');
  }

  function copiar() {
    const bs = document.getElementById('resBs').innerText;
    const montoVal = parseFloat(document.getElementById('monto').value || 0);
    const monto = montoVal.toLocaleString('es-BO');
    const tasa = document.getElementById('tasa').value;
    const anios = document.getElementById('anios').value;

    const msg = `🚗 *AUTOSALE MOTORS - COTIZACIÓN*\n• Monto: Bs ${monto}\n• Tasa: ${tasa}%\n• Plazo: ${anios} años\n👉 *Cuota mensual: ${bs}*`;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(msg).then(() => {
        alert('¡Copiado para WhatsApp!');
      }).catch(() => fallbackCopy(msg));
    } else {
      fallbackCopy(msg);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
      document.execCommand('copy');
      alert('¡Copiado para WhatsApp!');
    } catch (err) {
      alert('No se pudo copiar automáticamente. Copia la cotización manualmente.');
    }
    
    document.body.removeChild(textArea);
  }

  // Event Listeners para entradas de texto
  document.getElementById('monto').addEventListener('input', calc);
  
  document.getElementById('tasa').addEventListener('input', (e) => {
    updateChips('tasa', e.target.value);
    calc();
  });
  
  document.getElementById('anios').addEventListener('input', (e) => {
    updateChips('anios', e.target.value);
    calc();
  });

  // Inicializar cálculo al cargar
  calc();
</script>

</body>
</html>
