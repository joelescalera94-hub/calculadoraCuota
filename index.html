<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutosaleMotors - Cotizador</title>
  
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    :root {
      /* MODO CLARO */
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus: #e11d48;
      --chip-bg: #f1f5f9;
      --chip-border: #e2e8f0;
      --chip-text: #475569;
      --chip-active-bg: #0f172a;
      --chip-active-text: #ffffff;
      --accent-red: #e11d48;
      --highlight-bg: rgba(225, 29, 72, 0.04);
      --res-bg: #0f172a;
      --res-text: #ffffff;
      --res-sub-bg: rgba(255, 255, 255, 0.1);
      --res-sub-text: #cbd5e1;
      --btn-bg: #e11d48;
      --btn-hover: #be123c;
      --btn-text: #ffffff;
      --logo-bg: #000000;
      --toggle-bg: #f1f5f9;
      --toggle-border: #e2e8f0;
      --toggle-icon: #0f172a;
      --card-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.05);
    }

    [data-theme="dark"] {
      /* MODO OSCURO (Predeterminado) */
      --bg-body: #080c14;
      --card-bg: #111827;
      --card-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: #1f2937;
      --input-border: #374151;
      --input-focus: #f43f5e;
      --chip-bg: #1f2937;
      --chip-border: #374151;
      --chip-text: #d1d5db;
      --chip-active-bg: #f43f5e;
      --chip-active-text: #ffffff;
      --accent-red: #f43f5e;
      --highlight-bg: rgba(244, 63, 94, 0.08);
      --res-bg: #1e293b;
      --res-text: #ffffff;
      --res-sub-bg: rgba(244, 63, 94, 0.15);
      --res-sub-text: #fda4af;
      --btn-bg: #f43f5e;
      --btn-hover: #e11d48;
      --btn-text: #ffffff;
      --logo-bg: #000000;
      --toggle-bg: #1f2937;
      --toggle-border: #374151;
      --toggle-icon: #fbbf24;
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; 
    }
    
    body { 
      background: var(--bg-body); 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding-top: 0;
    }

    .card { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 400px; 
      border-radius: 20px; 
      padding: 24px; 
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow); 
      position: relative;
      padding-top: 0;
      padding-bottom: 15px;
    }
    


    .app-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .theme-toggle {
      background: var(--toggle-bg);
      color: var(--toggle-icon);
      border: 1px solid var(--toggle-border);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      position: absolute;
      right: 25px;
      top: 15px;
    }

    .logo-container { 
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 200px;
      margin: auto;
      padding: 10px;
    }

    .logo-container img { 
        
      max-width: 200px; 
      height: auto; 
      display: block;
    }

    .header-title { 
      font-size: 11px; 
      font-weight: 800; 
      color: var(--accent-red); 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      text-align: center;
      margin-bottom: 20px; 
    }

    .grid-2 { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
    }
    
    .field { 
      margin-bottom: 16px; 
      text-align: left; 
    }
    
    label { 
      display: block; 
      font-size: 10px; 
      font-weight: 700; 
      color: var(--text-muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
    }

    input { 
      width: 100%; 
      padding: 10px 12px; 
      border: 1px solid var(--input-border); 
      border-radius: 10px; 
      font-size: 14px; 
      font-weight: 600; 
      background: var(--input-bg); 
      color: var(--text-main);
      outline: none; 
    }

    input:focus { 
      border-color: var(--input-focus); 
    }

    input[readonly] { 
      opacity: 0.7; 
      cursor: not-allowed; 
    }

    /* Resalte ligero para Monto a Financiar */
    .field.highlight label {
      color: var(--accent-red);
    }

    .field.highlight input {
      border: 1.5px solid var(--accent-red);
      background: var(--highlight-bg);
      font-weight: 700;
    }

    .chips { 
      display: flex; 
      gap: 5px; 
      margin-top: 6px; 
      flex-wrap: wrap; 
    }

    .chip { 
      padding: 5px 10px; 
      background: var(--chip-bg); 
      border: 1px solid var(--chip-border); 
      border-radius: 8px; 
      font-size: 11px; 
      font-weight: 600; 
      color: var(--chip-text); 
      cursor: pointer; 
    }

    .chip.active { 
      background: var(--chip-active-bg); 
      color: var(--chip-active-text); 
      border-color: var(--chip-active-bg); 
    }

    /* Caja de Resultados */
    .res-box { 
      background: var(--res-bg); 
      color: var(--res-text); 
      border-radius: 14px; 
      padding: 5px; 
      text-align: center; 
      margin-top: 10px; 
      border: 1px solid rgba(255, 255, 255, 0.05);

    }

    .res-title { 
      font-size: 10px; 
      text-transform: uppercase; 
      font-weight: 700; 
      opacity: 0.7; 
      letter-spacing: 1px; 
    }

    .res-main { 
      font-size: 30px; 
      font-weight: 800; 
      margin-top: 2px; 
      letter-spacing: -0.5px;
    }

    .res-sub { 
      font-size: 12px; 
      font-weight: 600; 
      color: var(--res-sub-text); 
      margin-top: 8px; 
      background: var(--res-sub-bg); 
      padding: 4px 12px; 
      border-radius: 20px; 
      display: inline-block; 
    }

    .btn { 
      width: 30px; 
      background: var(--card-shadow); 
      border: none; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 700; 
      cursor: pointer; 
      display: flex; 
      position: absolute;
      right: 30px;
      top: 65px;
    }

  </style>
</head>
<body data-theme="dark">

<div class="card">
  <div class="top-bar">
    
  </div>

  <div class="logo-container">
    <img src="logo.png" alt="Autosale Motors Logo">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Cambiar Tema">☀️</button>
    <button class="btn" onclick="copiar()"><svg viewBox="-2.73 0 1225.016 1225.016" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path fill="#E0E0E0" d="M1041.858 178.02C927.206 63.289 774.753.07 612.325 0 277.617 0 5.232 272.298 5.098 606.991c-.039 106.986 27.915 211.42 81.048 303.476L0 1225.016l321.898-84.406c88.689 48.368 188.547 73.855 290.166 73.896h.258.003c334.654 0 607.08-272.346 607.222-607.023.056-162.208-63.052-314.724-177.689-429.463zm-429.533 933.963h-.197c-90.578-.048-179.402-24.366-256.878-70.339l-18.438-10.93-191.021 50.083 51-186.176-12.013-19.087c-50.525-80.336-77.198-173.175-77.16-268.504.111-278.186 226.507-504.503 504.898-504.503 134.812.056 261.519 52.604 356.814 147.965 95.289 95.36 147.728 222.128 147.688 356.948-.118 278.195-226.522 504.543-504.693 504.543z"></path><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="609.77" y1="1190.114" x2="609.77" y2="21.084"><stop offset="0" stop-color="#20b038"></stop><stop offset="1" stop-color="#60d66a"></stop></linearGradient><path fill="url(#a)" d="M27.875 1190.114l82.211-300.18c-50.719-87.852-77.391-187.523-77.359-289.602.133-319.398 260.078-579.25 579.469-579.25 155.016.07 300.508 60.398 409.898 169.891 109.414 109.492 169.633 255.031 169.57 409.812-.133 319.406-260.094 579.281-579.445 579.281-.023 0 .016 0 0 0h-.258c-96.977-.031-192.266-24.375-276.898-70.5l-307.188 80.548z"></path><image overflow="visible" opacity=".08" width="682" height="639" xlink:href="FCC0802E2AF8A915.png" transform="translate(270.984 291.372)"></image><path fill-rule="evenodd" clip-rule="evenodd" fill="#FFF" d="M462.273 349.294c-11.234-24.977-23.062-25.477-33.75-25.914-8.742-.375-18.75-.352-28.742-.352-10 0-26.25 3.758-39.992 18.766-13.75 15.008-52.5 51.289-52.5 125.078 0 73.797 53.75 145.102 61.242 155.117 7.5 10 103.   </div>

  <!-- Moneda y Tipo de Cambio -->
  <div class="grid-2">
    <div class="field">
      <label>Moneda Base</label>
      <div class="chips">
        <span class="chip active" id="chip-usd" onclick="cambiarMoneda('USD')">$ USD</span>
        <span class="chip" id="chip-bob" onclick="cambiarMoneda('BOB')">Bs BOB</span>
      </div>
    </div>

    <div class="field">
      <label for="tc">T. Cambio (Bs/$)</label>
      <input type="number" id="tc" value="0" step="0.01" placeholder="0">
    </div>
  </div>

  <!-- Precio del Vehículo -->
  <div class="field">
    <label for="precio" id="lbl-precio">Precio ($)</label>
    <input type="number" id="precio" value="0" step="500">
  </div>

  <!-- Cuota Inicial con Selección por Porcentaje -->
  <div class="field">
    <label for="inicial" id="lbl-inicial">Cuota Inicial ($)</label>
    <input type="number" id="inicial" value="0" step="500">
    <div class="chips" id="chips-pct-inicial">
      <span class="chip active" data-pct="0" onclick="selectPctInicial(0, this)">0%</span>
      <span class="chip" data-pct="10" onclick="selectPctInicial(10, this)">10%</span>
      <span class="chip" data-pct="20" onclick="selectPctInicial(20, this)">20%</span>
      <span class="chip" data-pct="30" onclick="selectPctInicial(30, this)">30%</span>
      <span class="chip" data-pct="50" onclick="selectPctInicial(50, this)">50%</span>
    </div>
  </div>

  <!-- Monto a Financiar (Resaltado) -->
  <div class="field highlight">
    <label for="monto" id="lbl-monto">Monto a Financiar ($)</label>
    <input type="number" id="monto" value="0" readonly>
  </div>

  <!-- Tasa de Interés -->
  <div class="field">
    <label for="tasa">Tasa de Interés Anual (%)</label>
    <input type="number" id="tasa" value="16" step="0.1">
    <div class="chips" id="chips-tasa">
      <span class="chip" data-val="11.5" onclick="selectChip('tasa', 11.5, this)">11.5%</span>
      <span class="chip" data-val="12" onclick="selectChip('tasa', 12, this)">12%</span>
      <span class="chip active" data-val="16" onclick="selectChip('tasa', 16, this)">16%</span>
      <span class="chip" data-val="20" onclick="selectChip('tasa', 20, this)">20%</span>
      <span class="chip" data-val="22" onclick="selectChip('tasa', 22, this)">22%</span>
    </div>
  </div>

  <!-- Plazo -->
  <div class="field">
    <label for="anios">Plazo (Años)</label>
    <input type="number" id="anios" value="5" step="1">
    <div class="chips" id="chips-anios">
      <span class="chip active" data-val="5" onclick="selectChip('anios', 5, this)">5 Años</span>
      <span class="chip" data-val="7" onclick="selectChip('anios', 7, this)">7 Años</span>
    </div>
  </div>

  <!-- Cuota Resultante -->
  <div class="res-box">
    <div class="res-title">Cuota Mensual Estimada</div>
    <div class="res-main" id="resMain">$ 0</div>
    <div class="res-sub" id="resSub">Equivalente: Bs 0</div>
     
  </div>

 
</div>

<script>
  const SEGURO_DESGRAVAMEN = 1.55;
  let monedaActual = 'USD';
  let pctInicialActivo = 0;

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.body.removeAttribute('data-theme');
      document.getElementById('themeBtn').innerText = '🌙';
      localStorage.setItem('theme', 'light');
    } else {
      document.body.setAttribute('data-theme', 'dark');
      document.getElementById('themeBtn').innerText = '☀️';
      localStorage.setItem('theme', 'dark');
    }
  }

  // Carga inicial de tema (Modo oscuro por defecto salvo elección en 'light')
  if (localStorage.getItem('theme') === 'light') {
    document.body.removeAttribute('data-theme');
    document.getElementById('themeBtn').innerText = '🌙';
  } else {
    document.body.setAttribute('data-theme', 'dark');
    document.getElementById('themeBtn').innerText = '☀️';
  }

  function selectPctInicial(pct, element) {
    pctInicialActivo = pct;
    const precio = parseFloat(document.getElementById('precio').value) || 0;
    const inicial = Math.round(precio * (pct / 100));
    document.getElementById('inicial').value = inicial;
    
    updatePctChips(pct);
    calc();
  }

  function updatePctChips(pct) {
    const container = document.getElementById('chips-pct-inicial');
    if (!container) return;
    container.querySelectorAll('.chip').forEach(chip => {
      if (parseFloat(chip.getAttribute('data-pct')) === parseFloat(pct)) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });
  }

  function cambiarMoneda(nuevaMoneda) {
    if (monedaActual === nuevaMoneda) return;

    const tc = parseFloat(document.getElementById('tc').value) || 0;
    let precio = parseFloat(document.getElementById('precio').value) || 0;
    let inicial = parseFloat(document.getElementById('inicial').value) || 0;

    if (tc > 0) {
      if (nuevaMoneda === 'BOB') {
        precio = Math.round(precio * tc);
        inicial = Math.round(inicial * tc);
      } else {
        precio = Math.round(precio / tc);
        inicial = Math.round(inicial / tc);
      }
    }

    monedaActual = nuevaMoneda;

    document.getElementById('precio').value = precio;
    document.getElementById('inicial').value = inicial;

    document.getElementById('chip-usd').classList.toggle('active', nuevaMoneda === 'USD');
    document.getElementById('chip-bob').classList.toggle('active', nuevaMoneda === 'BOB');

    const sim = nuevaMoneda === 'USD' ? '$' : 'Bs';
    document.getElementById('lbl-precio').innerText = `Precio (${sim})`;
    document.getElementById('lbl-inicial').innerText = `Cuota Inicial (${sim})`;
    document.getElementById('lbl-monto').innerText = `Monto a Financiar (${sim})`;

    calc();
  }

  function selectChip(inputId, value, element) {
    document.getElementById(inputId).value = value;
    updateChips(inputId, value);
    calc();
  }

  function updateChips(inputId, value) {
    const container = document.getElementById(`chips-${inputId}`);
    if (!container) return;
    
    container.querySelectorAll('.chip').forEach(chip => {
      if (parseFloat(chip.getAttribute('data-val')) === parseFloat(value)) {
        chip.classList.add('active');
      } else {
        chip.classList.remove('active');
      }
    });
  }

  function calc() {
    const tc = parseFloat(document.getElementById('tc').value) || 0;
    const precioInput = parseFloat(document.getElementById('precio').value) || 0;
    const inicialInput = parseFloat(document.getElementById('inicial').value) || 0;
    
    const montoInput = Math.max(0, precioInput - inicialInput);
    document.getElementById('monto').value = montoInput;

    const tasaInteres = parseFloat(document.getElementById('tasa').value) || 0;
    const yrs = parseFloat(document.getElementById('anios').value) || 0;

    if (montoInput <= 0 || tasaInteres <= 0 || yrs <= 0 || tc <= 0) {
      document.getElementById('resMain').innerText = monedaActual === 'USD' ? "$ 0" : "Bs 0";
      document.getElementById('resSub').innerText = monedaActual === 'USD' ? "Equivalente: Bs 0" : "Equivalente: $ 0";
      return;
    }

    let montoBs = monedaActual === 'USD' ? (montoInput * tc) : montoInput;

    const tasaTotal = tasaInteres + SEGURO_DESGRAVAMEN;
    const n = yrs * 12;
    const i = (tasaTotal / 100) / 12;

    const cuotaBsCalculada = montoBs * (i * Math.pow(1 + i, n)) / (Math.pow(1 + i, n) - 1);
    const cuotaBs = Math.round(cuotaBsCalculada);
    const cuotaUSD = Math.round(cuotaBsCalculada / tc);

    if (monedaActual === 'USD') {
      document.getElementById('resMain').innerText = "$ " + cuotaUSD.toLocaleString('en-US');
      document.getElementById('resSub').innerText = "Equivalente: Bs " + cuotaBs.toLocaleString('es-BO');
    } else {
      document.getElementById('resMain').innerText = "Bs " + cuotaBs.toLocaleString('es-BO');
      document.getElementById('resSub').innerText = "Equivalente: $ " + cuotaUSD.toLocaleString('en-US');
    }
  }

  function copiar() {
    const tc = parseFloat(document.getElementById('tc').value) || 0;
    const precioInput = parseFloat(document.getElementById('precio').value) || 0;
    const inicialInput = parseFloat(document.getElementById('inicial').value) || 0;
    const montoInput = parseFloat(document.getElementById('monto').value) || 0;
    const tasa = document.getElementById('tasa').value;
    const anios = document.getElementById('anios').value;

    const resMain = document.getElementById('resMain').innerText;
    const resSub = document.getElementById('resSub').innerText;

    let precioUSD, precioBs, inicialUSD, inicialBs, montoUSD, montoBs;

    if (monedaActual === 'USD') {
      precioUSD = precioInput;
      precioBs = Math.round(precioInput * tc);
      inicialUSD = inicialInput;
      inicialBs = Math.round(inicialInput * tc);
      montoUSD = montoInput;
      montoBs = Math.round(montoInput * tc);
    } else {
      precioBs = precioInput;
      precioUSD = tc > 0 ? Math.round(precioInput / tc) : 0;
      inicialBs = inicialInput;
      inicialUSD = tc > 0 ? Math.round(inicialInput / tc) : 0;
      montoBs = montoInput;
      montoUSD = tc > 0 ? Math.round(montoInput / tc) : 0;
    }

    let msg = `🚗 *AUTOSALE MOTORS - FINANCIAMIENTO BANCARIO*\n\n`;
    msg += `• Tipo de Cambio: Bs ${tc}\n`;
    msg += `• Precio: $ ${precioUSD.toLocaleString('en-US')}  (Bs ${precioBs.toLocaleString('es-BO')})\n`;
    msg += `• Cuota Inicial: $ ${inicialUSD.toLocaleString('en-US')}  (Bs ${inicialBs.toLocaleString('es-BO')})\n`;
    msg += `• Monto a Financiar: $ ${montoUSD.toLocaleString('en-US')}  (Bs ${montoBs.toLocaleString('es-BO')})\n`;
    msg += `• Tasa de Interés: ${tasa}%\n`;
    msg += `• Plazo: ${anios} años\n\n`;
    msg += `👉 *Cuota mensual: ${resMain}* (${resSub})`;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(msg).then(() => {
        alert('¡Cotización copiada para WhatsApp!');
      }).catch(() => fallbackCopy(msg));
    } else {
      fallbackCopy(msg);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    
    try {
      document.execCommand('copy');
      alert('¡Cotización copiada para WhatsApp!');
    } catch (err) {
      alert('Copie el texto manualmente.');
    }
    
    document.body.removeChild(textArea);
  }

  // Event Listeners
  document.getElementById('tc').addEventListener('input', calc);

  document.getElementById('precio').addEventListener('input', () => {
    if (pctInicialActivo !== null && pctInicialActivo >= 0) {
      const precio = parseFloat(document.getElementById('precio').value) || 0;
      const inicial = Math.round(precio * (pctInicialActivo / 100));
      document.getElementById('inicial').value = inicial;
    }
    calc();
  });

  document.getElementById('inicial').addEventListener('input', (e) => {
    const precio = parseFloat(document.getElementById('precio').value) || 0;
    const inicial = parseFloat(e.target.value) || 0;
    
    if (precio > 0) {
      const pct = (inicial / precio) * 100;
      pctInicialActivo = pct;
      updatePctChips(pct);
    } else {
      pctInicialActivo = null;
      updatePctChips(-1);
    }
    calc();
  });
  
  document.getElementById('tasa').addEventListener('input', (e) => {
    updateChips('tasa', e.target.value);
    calc();
  });
  
  document.getElementById('anios').addEventListener('input', (e) => {
    updateChips('anios', e.target.value);
    calc();
  });

  calc();
</script>

</body>
</html>
